<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="#0D1F1E" stroke="#D4A843" stroke-width="2"/>
  <!-- French flag halves inside inner circle -->
  <clipPath id="inner">
    <circle cx="32" cy="32" r="22"/>
  </clipPath>
  <g clip-path="url(#inner)">
    <rect x="10" y="10" width="15" height="44" fill="#002395"/>
    <rect x="25" y="10" width="15" height="44" fill="#FFFFFF"/>
    <rect x="40" y="10" width="14" height="44" fill="#ED2939"/>
  </g>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#D4A843" stroke-width="1.5"/>
  <!-- Cedar tree -->
  <g transform="translate(32,32)">
    <!-- Trunk -->
    <rect x="-2" y="8" width="4" height="7" fill="#5D4037"/>
    <!-- Layers of branches -->
    <polygon points="0,-14 -10,0 10,0" fill="#2E7D32"/>
    <polygon points="0,-10 -13,4 13,4" fill="#388E3C"/>
    <polygon points="0,-5 -16,9 16,9" fill="#43A047"/>
  </g>
</svg>
